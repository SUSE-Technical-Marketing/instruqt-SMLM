description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>Ao longo deste workshop, você explorará as principais capacidades do <b style="color: #30ba78">SUSE Multi-Linux Manager</b>, nossa solução de primeira linha para gerenciar diversos ambientes Linux em escala, e o <b style="color: #30ba78">SUSE Multi-Linux Support</b></p>

  <p>Você aprenderá a resolver desafios de TI do mundo real utilizando as ferramentas poderosas da <b style="color: #30ba78">SUSE</b> para automatizar tarefas, garantir a conformidade de segurança e gerenciar todo o ciclo de vida de seus sistemas—desde distribuições legadas até os servidores corporativos mais recentes.</p>

  <p>Este workshop foi projetado para lhe dar habilidades práticas e uma compreensão clara de como simplificar e controlar sua infraestrutura complexa.</p>

  <p>Vamos começar.</p></span>
