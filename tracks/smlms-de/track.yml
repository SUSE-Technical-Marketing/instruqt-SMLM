description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>Im Verlauf dieses Workshops werden Sie die Kernfunktionen von <b style="color: #30ba78">SUSE Multi-Linux Manager</b>, unserer erstklassigen Lösung zur Verwaltung vielfältiger Linux-Umgebungen im großen Maßstab, sowie von <b style="color: #30ba78">SUSE Multi-Linux Support</b> kennenlernen.</p>

  <p>Sie erfahren, wie Sie reale IT-Herausforderungen lösen, indem Sie die leistungsstarken Tools von <b style="color: #30ba78">SUSE</b> nutzen, um Aufgaben zu automatisieren, die Sicherheits-Compliance zu gewährleisten und den gesamten Lebenszyklus Ihrer Systeme zu verwalten – von Legacy-Distributionen bis hin zu den neuesten Enterprise-Servern.</p>

  <p>Dieser Workshop wurde entwickelt, um Ihnen praktische Fähigkeiten und ein klares Verständnis dafür zu vermitteln, wie Sie Ihre komplexe Infrastruktur vereinfachen und kontrollieren können.</p>

  <p>Legen wir los.</p></span>
