description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>خلال ورشة العمل هذه، ستستكشف القدرات الأساسية لـ <b style="color: #30ba78">SUSE Multi-Linux Manager</b>، وهو الحل الأفضل في فئته لإدارة بيئات Linux المتنوعة على نطاق واسع، و <b style="color: #30ba78">SUSE Multi-Linux Support</b></p>

  <p>ستتعلم كيفية حل تحديات تكنولوجيا المعلومات (IT) الواقعية باستخدام أدوات <b style="color: #30ba78">SUSE</b> القوية لأتمتة المهام، وضمان الامتثال الأمني، وإدارة دورة حياة أنظمتك بالكامل—بدءاً من التوزيعات القديمة (Legacy) وصولاً إلى أحدث خوادم المؤسسات.</p>

  <p>صُممت ورشة العمل هذه لتمنحك مهارات عملية وفهماً واضحاً لكيفية تبسيط البنية التحتية المعقدة لديك والتحكم فيها.</p>

  <p>لنبدأ.</p></span>
