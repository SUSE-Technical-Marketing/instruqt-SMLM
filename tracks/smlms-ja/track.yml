description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>このワークショップを通して、大規模で多様なLinux環境を管理するためのクラス最高峰のソリューションである <b style="color: #30ba78">SUSE Multi-Linux Manager</b> と、<b style="color: #30ba78">SUSE Multi-Linux Support</b> の主要機能について学習します。</p>

  <p><b style="color: #30ba78">SUSE</b> の強力なツールを使用して、タスクの自動化、セキュリティコンプライアンスの確保、そしてレガシーディストリビューションから最新のエンタープライズサーバーに至るまでのシステムライフサイクル全体を管理し、実際のIT課題を解決する方法を学びます。</p>

  <p>本ワークショップは、実践的なスキルを習得し、複雑なインフラストラクチャを簡素化および制御する方法を明確に理解できるように設計されています。</p>

  <p>さあ、始めましょう。</p></span>
