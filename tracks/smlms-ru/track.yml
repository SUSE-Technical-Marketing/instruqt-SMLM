description: |
  <span style="font-family: suse; src: url('https://fonts.google.com/specimen/SUSE');"><p>В ходе этого семинара вы познакомитесь с основными возможностями <b style="color: #30ba78">SUSE Multi-Linux Manager</b> — нашего лучшего в своем классе решения для масштабного управления разнородными средами Linux, а также <b style="color: #30ba78">SUSE Multi-Linux Support</b>.</p>

  <p>Вы научитесь решать реальные IT-задачи, используя мощные инструменты <b style="color: #30ba78">SUSE</b> для автоматизации процессов, обеспечения безопасности и управления полным жизненным циклом ваших систем — от унаследованных дистрибутивов до новейших корпоративных серверов.</p>

  <p>Этот семинар призван дать вам практические навыки и четкое понимание того, как упростить вашу сложную инфраструктуру и взять ее под контроль.</p>

  <p>Приступим.</p></span>
